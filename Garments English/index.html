<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geeta - English Learning Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 14px;
        }

        .learning-app {
            background: #fff;
            padding: 20px;
            border-radius: 28px;
            max-width: 760px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* ক্যাটাগরি গ্রিড ডিজাইন */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category-card {
            border: 0;
            color: #ffffff;
            text-align: left;
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .category-icon {
            font-size: 28px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 12px;
        }

        .category-info {
            flex: 1;
        }

        .category-number {
            font-size: 11px;
            opacity: 0.85;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .category-name {
            display: block;
            font-size: 15px;
            font-weight: 800;
        }

        .category-description {
            display: block;
            font-size: 11px;
            opacity: .9;
            margin-top: 4px;
            line-height: 1.3;
        }

        /* লার্নিং এরিয়া */
        .learning-area {
            text-align: center;
        }

        .back-button {
            border: 0;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            float: left;
            margin-bottom: 15px;
        }

        .display-item {
            font-size: 45px;
            font-weight: 900;
            color: #1e1b4b;
            margin: 15px 0 5px 0;
        }

        .sub-desc {
            font-size: 16px;
            color: #334155;
            font-weight: bold;
        }

        .pronunciation {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-status {
            font-size: 15px;
            color: #1e293b;
            font-weight: bold;
            margin: 15px 0;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        .btn-yellow {
            background: #eab308;
            color: #fff;
        }

        .btn-purple {
            background: #9333ea;
            color: #fff;
        }

        .btn-blue {
            background: #2563eb;
            color: #fff;
        }

        .btn-green {
            background: #10b981;
            color: #fff;
        }

        .btn-gray {
            background: #e2e8f0;
            color: #475569;
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            margin-top: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

            <div style="clear: both;"></div>

            <div class="sub-desc" id="subDesc"></div>
            <div class="pronunciation" id="pronunciation"></div>

            if (writeCount >= 5 && speakCount >= 5) {
                document.getElementById('nextBtn').disabled = false;
                document.getElementById('nextBtn').style.background = '#2563eb';
                document.getElementById('nextBtn').style.color = '#fff';
            } else {
                document.getElementById('nextBtn').disabled = true;
                document.getElementById('nextBtn').style.background = '#e2e8f0';
                document.getElementById('nextBtn').style.color = '#475569';
            }
        }

        function speakWord() {
            var text = learningData[currentCat][currentIndex].text;
            var msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
            document.getElementById('statusMsg').innerHTML = 'সম্পূর্ণ উচ্চারণ শোনা হচ্ছে...';
        }

        function spellWord() {
            var text = learningData[currentCat][currentIndex].text;
            for (var i = 0; i < text.length; i++) {
                var msg = new SpeechSynthesisUtterance(text[i]);
                msg.lang = 'en-US';
                msg.rate = 0.5;
                window.speechSynthesis.speak(msg);
            }
            document.getElementById('statusMsg').innerHTML = 'বানান করে শোনা হচ্ছে...';
        }

        function verifyWriting() {
            var val = document.getElementById('userInput').value.trim();
            var target = learningData[currentCat][currentIndex].text;

            if (val.toLowerCase() === target.toLowerCase()) {
                if (writeCount < 5) {
                    writeCount++;
                    updateView();
                    document.getElementById('statusMsg').innerHTML = 'সঠিক লিখেছে! (' + writeCount + '/৫)';
                }
            } else {
                alert('সঠিক শব্দ লিখে যাচাই করুন!');
            }
        }

        function verifyVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('আপনার ব্রাউজার ভয়েস রিকগনিশন সমর্থন করে না।');
                return;
            }

            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            var recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            document.getElementById('statusMsg').innerHTML = 'দয়া করে শব্দটি মুখে বলুন...';

            recognition.onresult = function (event) {
                var spokenText = event.results[0][0].transcript.trim();
                var target = learningData[currentCat][currentIndex].text;

                if (spokenText.toLowerCase().includes(target.toLowerCase())) {
                    if (speakCount < 5) {
                        speakCount++;
                        updateView();
                        document.getElementById('statusMsg').innerHTML = 'সঠিক উচ্চারণ হয়েছে! (' + speakCount + '/৫)';
                    }
                } else {
                    document.getElementById('statusMsg').innerHTML = 'মিলেনি ("' + spokenText + '"), আবার বলুন।';
                }
            };

            recognition.start();
        }

        function nextItem() {
            var items = learningData[currentCat];
            if (currentIndex < items.length - 1) {
                currentIndex++;
                writeCount = 0;
                speakCount = 0;
                updateView();
            } else {
                alert('এই ক্যাটাগরির সব শব্দ শেষ!');
                backToMenu();
            }
        }

        function backToMenu() {
            document.getElementById('menuArea').className = 'category-grid';
            document.getElementById('learningArea').className = 'learning-area hidden';
        }
    </script>
</body>

</html>
